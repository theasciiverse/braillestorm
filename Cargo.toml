[package]
name = "braillestorm"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Asciiverse twin-stick arena shooter drawn in Braille vector lines over a warping grid, Rust + Ratatui"

[[bin]]
name = "braillestorm"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
gilrs = { version = "0.11", optional = true }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
