[package]
name = "braillestorm"
version = "0.1.0"
edition = "2021"
description = "Asciiverse twin-stick arena shooter drawn in Braille vector lines over a warping grid, Rust + Ratatui"

[[bin]]
name = "braillestorm"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
gilrs = { version = "0.11", optional = true }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
